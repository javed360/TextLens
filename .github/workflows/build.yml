mkdir -p .github/workflows

cat > .github/workflows/build.yml <<'EOF'
name: Build APK

on:
  workflow_dispatch:
    inputs:
      ocr_data:
        description: "OCR language files inside the APK (none = smallest APK, downloaded on first use)"
        type: choice
        default: mixed
        options:
          - mixed
          - fast
          - none
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Bundle OCR language data
        env:
          MODE: ${{ github.event.inputs.ocr_data || 'mixed' }}
        run: |
          set -e
          echo "OCR data mode: $MODE"
          if [ "$MODE" = "none" ]; then
            echo "Nothing bundled - the app will download the language files on first use."
            exit 0
          fi
          mkdir -p app/src/main/assets/tessdata
          get() {
            curl -L --fail --retry 3 --retry-delay 5 \
              -o "app/src/main/assets/tessdata/$2.traineddata" \
              "https://github.com/tesseract-ocr/$1/raw/main/$2.traineddata"
          }
          case "$MODE" in
            fast)  for l in ben ara eng; do get tessdata_fast "$l"; done ;;
            *)     get tessdata_best ben; get tessdata_best ara; get tessdata_fast eng ;;
          esac
          ls -la app/src/main/assets/tessdata

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: TextLens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
EOF

