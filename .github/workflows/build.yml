name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found at: $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download OCR language data
        run: |
          set -e
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 --retry-delay 3 \
            -o app/src/main/assets/tessdata/ben.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/ben.traineddata
          curl -fL --retry 3 --retry-delay 3 \
            -o app/src/main/assets/tessdata/ara.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata
          curl -fL --retry 3 --retry-delay 3 \
            -o app/src/main/assets/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          test -s app/src/main/assets/tessdata/ben.traineddata
          test -s app/src/main/assets/tessdata/ara.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata
          ls -lh app/src/main/assets/tessdata

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextLens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
